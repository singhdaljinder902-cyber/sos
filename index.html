<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Safe Sakhi SOS</title>

<!-- Manifest -->
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#ff4d6d">

<style>

body{
margin:0;
font-family: Arial, sans-serif;
background: linear-gradient(180deg,#ff758f,#ff4d6d);
color:white;
text-align:center;
}

/* Top Logo Area */
.header{
padding-top:40px;
}

.logo{
width:90px;
height:90px;
border-radius:20px;
}

/* App Name */
h1{
margin-top:10px;
font-size:28px;
}

/* SOS Button Area */
.sos-container{
margin-top:80px;
}

/* Big SOS Button */
.sos-btn{
width:200px;
height:200px;
border-radius:50%;
border:none;
font-size:40px;
font-weight:bold;
background:white;
color:#ff4d6d;
box-shadow:0 0 25px rgba(0,0,0,0.3);
}

.sos-btn:active{
transform:scale(0.95);
}

/* Bottom Text */
.help-text{
margin-top:60px;
font-size:16px;
opacity:0.9;
}

</style>
</head>

<body>

<div class="header">
<img src="icon-192.png" class="logo">
<h1>Safe Sakhi</h1>
</div>

<div class="sos-container">
<button class="sos-btn" onclick="sendSOS()">SOS</button>
</div>

<div class="help-text">
Tap SOS in Emergency
</div>

<script>
function sendSOS(){

alert("SOS Activated");

// 112 Call
window.location.href="tel:112";

}
</script>

<!-- Service Worker -->
<script>
if ("serviceWorker" in navigator) {
window.addEventListener("load", function() {
navigator.serviceWorker.register("service-worker.js");
});
}
</script>

</body>
</html>
